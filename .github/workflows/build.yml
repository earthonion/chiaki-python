name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev zlib1g-dev protobuf-compiler
          python3 -m pip install protobuf==5.28.3 grpcio-tools==1.64.0

      - name: Build libchiaki
        run: ./build.sh

      - name: Compile Python sources
        run: python3 -m py_compile chiaki_python/*.py examples/*.py

      - name: Test profile parsing
        run: |
          python3 - <<'PY'
          import json
          from chiaki_python.config_parser import get_host_by_name, parse_bytearray

          assert parse_bytearray('@ByteArray(\\x01\\x02\\xff)') == b'\x01\x02\xff'
          profile = {
              'name': 'CI PS5',
              'host': '127.0.0.1',
              'target': 1000100,
              'is_ps5': True,
              'regist_key': 'not-a-real-key',
              'rp_key': '00' * 16,
          }
          with open('ci-profile.json', 'w') as stream:
              json.dump(profile, stream)
          assert get_host_by_name('ci-profile.json') == profile
          print('Byte-array and JSON profile parsing passed')
          PY

      - name: Upload libchiaki
        uses: actions/upload-artifact@v4
        with:
          name: libchiaki-linux-x86_64
          path: libchiaki.so
          if-no-files-found: error
